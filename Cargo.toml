[package]
name = "rust-btl"
version = "0.1.1"
edition = "2021"
authors = ["Luke Oliff <luke@lukeoliff.com>"]
license = "MIT"
description = "Background task manager that auto-replaces processes"
repository = "https://github.com/lukeocodes/btl"
keywords = ["background", "process", "task", "manager", "daemon"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "btl"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.27", features = ["signal", "process"] }
anyhow = "1.0"
dirs = "5.0"
clap = { version = "4.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
